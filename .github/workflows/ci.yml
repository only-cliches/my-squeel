name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: my-sqweel
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pmy-sqweel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CARGO_BUILD_JOBS: 1
      MYSQL_COMPARE_URL: mysql://root:my-sqweel@127.0.0.1:3306/test
      MYSQL_PARITY_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MySQL MTR runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            libaio1t64 \
            libjson-perl \
            libmecab2 \
            libnuma1 \
            libssl3t64 \
            libtirpc3t64 \
            mecab-ipadic-utf8 \
            zlib1g
      - name: Test compatibility report tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test all targets against real MySQL
        run: cargo test --all-targets --locked
      - name: Restore pinned MySQL MTR packages
        id: mysql-mtr-package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mysql-mtr-packages
          key: mysql-mtr-ubuntu24-amd64-8.0.43-v1
      - name: Prepare pinned MySQL upstream MTR binaries and suite
        run: |
          MYSQL_MTR_CACHE_DIR="$RUNNER_TEMP/mysql-mtr-packages" \
            tools/prepare_mysql_mtr.sh \
            "$RUNNER_TEMP/mysql-mtr" \
            --print-env > "$RUNNER_TEMP/mysql-mtr.env"
          source "$RUNNER_TEMP/mysql-mtr.env"
          test -f "$MYSQL_MTR_ROOT/mysql-test/t/select_all.test"
          test -x "$MYSQLTEST_BIN"
          test -x "$MYSQL_CLIENT_BINDIR/mysql"
      - name: Save pinned MySQL MTR packages
        if: steps.mysql-mtr-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mysql-mtr-packages
          key: ${{ steps.mysql-mtr-package-cache.outputs.cache-primary-key }}
      - name: Build MySqweel binary for MTR
        run: cargo build --locked --bin sqwl
      - name: Run supported MySQL upstream MTR surface
        run: |
          source "$RUNNER_TEMP/mysql-mtr.env"
          python3 tools/mysql_mtr_compat.py \
            --suite-root "$MYSQL_MTR_ROOT" \
            --allowlist tests/mysql-mtr-allowlist.txt \
            --mysql-url "$MYSQL_COMPARE_URL" \
            --mysqltest-bin "$MYSQLTEST_BIN" \
            --client-bindir "$MYSQL_CLIENT_BINDIR" \
            --mysqweel-bin target/debug/sqwl \
            --report-dir artifacts/mysql-mtr \
            --mysql-version 8.0.43 \
            --source-revision 2d6d5e10436a8f2b58d37af737c2a3e45855d0b7 \
            --minimum-percent 100
      - name: Upload MySQL MTR compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-mtr-compatibility-report
          path: |
            artifacts/mysql-mtr/mysql-mtr-report.json
            artifacts/mysql-mtr/mysql-mtr-report.md
            artifacts/mysql-mtr/**/stdout.log
            artifacts/mysql-mtr/**/stderr.log
            artifacts/mysql-mtr/**/mysqweel.log
            artifacts/mysql-mtr/**/my.cnf
          if-no-files-found: warn
